<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Clay Drop Shadow -->
    <filter id="clayShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <filter id="deepShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1e1b4b" flood-opacity="0.22" />
    </filter>

    <!-- Clay Gradients -->
    <linearGradient id="clayRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#ff7675" />
      <stop offset="100%" stopColor="#d63031" />
    </linearGradient>
    <linearGradient id="clayCoral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#ff9f43" />
      <stop offset="100%" stopColor="#ee5253" />
    </linearGradient>
    <linearGradient id="clayYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#ffeaa7" />
      <stop offset="60%" stopColor="#fdcb6e" />
      <stop offset="100%" stopColor="#e17055" />
    </linearGradient>
    <linearGradient id="clayGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#55efc4" />
      <stop offset="100%" stopColor="#00b894" />
    </linearGradient>
    <linearGradient id="clayTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#81ecec" />
      <stop offset="100%" stopColor="#00cec9" />
    </linearGradient>
    <linearGradient id="clayBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#74b9ff" />
      <stop offset="100%" stopColor="#0984e3" />
    </linearGradient>
    <linearGradient id="clayIndigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#a29bfe" />
      <stop offset="100%" stopColor="#6c5ce7" />
    </linearGradient>
    <linearGradient id="clayPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#fd79a8" />
      <stop offset="100%" stopColor="#e84393" />
    </linearGradient>
    <linearGradient id="clayPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#d980fa" />
      <stop offset="100%" stopColor="#9980fa" />
    </linearGradient>
    <linearGradient id="clayWhite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#dfe6e9" />
    </linearGradient>
    <linearGradient id="clayWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#e0b88f" />
      <stop offset="100%" stopColor="#b37d4e" />
    </linearGradient>
    <linearGradient id="clayGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#fff275" />
      <stop offset="50%" stopColor="#fbc531" />
      <stop offset="100%" stopColor="#e1b12c" />
    </linearGradient>
    <linearGradient id="claySilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#f5f6fa" />
      <stop offset="60%" stopColor="#dcdde1" />
      <stop offset="100%" stopColor="#718093" />
    </linearGradient>
    <linearGradient id="clayDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#636e72" />
      <stop offset="100%" stopColor="#2d3436" />
    </linearGradient>
    <linearGradient id="clayGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#81ecec" stopOpacity="0.3" />
    </linearGradient>

    <!-- Glossy Specular Highlight -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.65" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0" />
    </linearGradient>
  </defs>

  <!-- Ground Ambient Shadow -->
  <ellipse cx="256" cy="460" rx="170" ry="24" fill="#0f172a" opacity="0.12" />

  
      <g filter="url(#clayShadow)">
        <!-- Ruler Body (angled diagonally for 3D aesthetic) -->
        <rect x="66" y="210" width="380" height="96" rx="18" fill="url(#clayYellow)" transform="rotate(-15 256 256)" stroke="#e17055" stroke-width="4" />
        <g transform="rotate(-15 256 256)">
          <!-- Ruler Measurement Lines -->
          <line x1="90" y1="214" x2="90" y2="240" stroke="#2d3436" stroke-width="3" stroke-linecap="round" />
            <text x="90" y="258" font-size="14" font-weight="bold" font-family="sans-serif" fill="#2d3436" text-anchor="middle">0</text>
<line x1="112" y1="214" x2="112" y2="228" stroke="#2d3436" stroke-width="3" stroke-linecap="round" />
            
<line x1="134" y1="214" x2="134" y2="240" stroke="#2d3436" stroke-width="3" stroke-linecap="round" />
            <text x="134" y="258" font-size="14" font-weight="bold" font-family="sans-serif" fill="#2d3436" text-anchor="middle">2</text>
<line x1="156" y1="214" x2="156" y2="228" stroke="#2d3436" stroke-width="3" stroke-linecap="round" />
            
<line x1="178" y1="214" x2="178" y2="240" stroke="#2d3436" stroke-width="3" stroke-linecap="round" />
            <text x="178" y="258" font-size="14" font-weight="bold" font-family="sans-serif" fill="#2d3436" text-anchor="middle">4</text>
<line x1="200" y1="214" x2="200" y2="228" stroke="#2d3436" stroke-width="3" stroke-linecap="round" />
            
<line x1="222" y1="214" x2="222" y2="240" stroke="#2d3436" stroke-width="3" stroke-linecap="round" />
            <text x="222" y="258" font-size="14" font-weight="bold" font-family="sans-serif" fill="#2d3436" text-anchor="middle">6</text>
<line x1="244" y1="214" x2="244" y2="228" stroke="#2d3436" stroke-width="3" stroke-linecap="round" />
            
<line x1="266" y1="214" x2="266" y2="240" stroke="#2d3436" stroke-width="3" stroke-linecap="round" />
            <text x="266" y="258" font-size="14" font-weight="bold" font-family="sans-serif" fill="#2d3436" text-anchor="middle">8</text>
<line x1="288" y1="214" x2="288" y2="228" stroke="#2d3436" stroke-width="3" stroke-linecap="round" />
            
<line x1="310" y1="214" x2="310" y2="240" stroke="#2d3436" stroke-width="3" stroke-linecap="round" />
            <text x="310" y="258" font-size="14" font-weight="bold" font-family="sans-serif" fill="#2d3436" text-anchor="middle">10</text>
<line x1="332" y1="214" x2="332" y2="228" stroke="#2d3436" stroke-width="3" stroke-linecap="round" />
            
<line x1="354" y1="214" x2="354" y2="240" stroke="#2d3436" stroke-width="3" stroke-linecap="round" />
            <text x="354" y="258" font-size="14" font-weight="bold" font-family="sans-serif" fill="#2d3436" text-anchor="middle">12</text>
<line x1="376" y1="214" x2="376" y2="228" stroke="#2d3436" stroke-width="3" stroke-linecap="round" />
            
<line x1="398" y1="214" x2="398" y2="240" stroke="#2d3436" stroke-width="3" stroke-linecap="round" />
            <text x="398" y="258" font-size="14" font-weight="bold" font-family="sans-serif" fill="#2d3436" text-anchor="middle">14</text>
<line x1="420" y1="214" x2="420" y2="228" stroke="#2d3436" stroke-width="3" stroke-linecap="round" />
            
          <!-- CM label -->
          <text x="76" y="285" font-size="12" font-weight="bold" font-family="sans-serif" fill="#d63031">cm</text>
          <!-- Shiny clay bevel reflection -->
          <rect x="80" y="214" width="352" height="6" rx="3" fill="#ffffff" opacity="0.6" />
        </g>
      </g>
    
</svg>